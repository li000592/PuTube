name: PureTube
options:
  bundleIdPrefix: com.haorong
  deploymentTarget:
    iOS: 17.0
targets:
  PureTube:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.haorong.PureTube
      PRODUCT_NAME: PureTube
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_FILE: Sources/Resources/Info.plist
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: YES
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.0"
